name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar Java para o emulador Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar ferramentas
        run: npm install
      - name: Testar regras Firestore
        run: npm run test:rules
      - name: Gerar ficheiros de publicação
        run: node scripts/build.mjs --require-firebase
        env:
          WALEVA_FIREBASE_API_KEY: ${{ vars.WALEVA_FIREBASE_API_KEY }}
          WALEVA_FIREBASE_AUTH_DOMAIN: ${{ vars.WALEVA_FIREBASE_AUTH_DOMAIN }}
          WALEVA_FIREBASE_PROJECT_ID: ${{ vars.WALEVA_FIREBASE_PROJECT_ID }}
          WALEVA_FIREBASE_APP_ID: ${{ vars.WALEVA_FIREBASE_APP_ID }}
      - name: Carregar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
